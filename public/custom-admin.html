<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>委托工坊 · 专业中枢</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0c171c;
            font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #eef4f7;
            padding: 1.8rem;
        }

        .container {
            max-width: 1600px;
            margin: 0 auto;
        }

        /* 头部区域 - 纯居中 */
        .hero-section {
            background: linear-gradient(135deg, #162b24, #0f221d);
            border-radius: 32px;
            padding: 1.2rem 1.8rem;
            margin-bottom: 2rem;
            border: 1px solid rgba(255, 180, 71, 0.25);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: center;
        }

        .brand h1 {
            font-size: 1.7rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffd966, #ffb347);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            letter-spacing: -0.2px;
            margin-bottom: 0.75rem;
        }

        /* 统计行：一行内展示，小胶囊风格 */
        .stats-inline {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(30, 47, 42, 0.75);
            backdrop-filter: blur(6px);
            border-radius: 40px;
            padding: 0.35rem 1.2rem;
            border: 1px solid rgba(255, 180, 71, 0.3);
            font-size: 0.85rem;
            font-weight: 500;
            color: #e2f0ea;
            transition: all 0.2s;
        }

        .stat-pill strong {
            color: #ffd966;
            font-weight: 700;
            margin-right: 4px;
            font-size: 0.95rem;
        }

        /* ========= 关键修改：状态按钮强制一行 + 随屏幕缩放自动缩小 ========= */
        .filter-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
            overflow-x: visible;
        }

        .filter-bar {
            background: rgba(18, 35, 30, 0.9);
            backdrop-filter: blur(12px);
            border-radius: 80px;
            padding: 8px clamp(6px, 1.5vw, 20px);
            display: flex;
            flex-direction: row;
            flex-wrap: nowrap;           /* 强制一行，绝不换行 */
            justify-content: center;
            align-items: center;
            gap: clamp(4px, 1vw, 12px);
            border: 1px solid rgba(255, 180, 71, 0.45);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            overflow-x: visible;
            max-width: 100%;
        }

        .filter-btn {
            background: transparent;
            border: none;
            color: #cfebe4;
            padding: 8px clamp(12px, 2.5vw, 28px);
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.25s;
            font-weight: 600;
            font-size: clamp(0.7rem, 2.5vw, 0.85rem);
            font-family: inherit;
            letter-spacing: 0.3px;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #ffb347, #ff8c42);
            color: #1e2a2f;
            font-weight: 700;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.35);
        }

        /* 卡片网格 */
        .orders-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.8rem;
            margin-top: 0.5rem;
        }

        /* 委托卡片 - 高级质感 */
        .order-card {
            background: linear-gradient(145deg, #1a2f28, #14261f);
            border-radius: 32px;
            border: 1px solid rgba(255, 180, 71, 0.35);
            padding: 1.6rem;
            transition: all 0.28s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        .order-card:hover {
            transform: translateY(-5px);
            border-color: #ffb347;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            background: linear-gradient(145deg, #1f3e33, #173129);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            margin-bottom: 1rem;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(0, 0, 0, 0.3);
        }

        .status-pending { background: #f4a261; color: #241f1a; box-shadow: 0 0 6px rgba(244, 162, 97, 0.5); }
        .status-accepted { background: #2a9d8f; color: white; }
        .status-completed { background: #6c9ebf; color: white; }
        .status-rejected { background: #e76f51; color: white; }

        .order-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #ffdfb3;
            word-break: break-word;
            line-height: 1.3;
            flex: 1;
        }

        /* 预算高亮区域 */
        .budget-highlight {
            background: rgba(255, 180, 71, 0.12);
            border-radius: 28px;
            padding: 12px 16px;
            margin: 12px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px dashed rgba(255, 180, 71, 0.5);
        }

        .budget-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #ffcd94;
        }

        .budget-amount {
            font-size: 1.8rem;
            font-weight: 800;
            color: #ffcd7e;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .budget-amount small {
            font-size: 0.9rem;
            font-weight: 500;
            color: #e0b36a;
        }

        /* 需求描述预览区 */
        .desc-preview {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 24px;
            padding: 14px 16px;
            margin: 10px 0 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid rgba(100, 160, 120, 0.3);
        }

        .desc-preview:hover {
            background: rgba(0, 0, 0, 0.45);
            border-color: #ffb347;
            transform: scale(0.99);
        }

        .desc-preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            color: #ffd966;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .desc-preview-content {
            font-size: 0.85rem;
            line-height: 1.5;
            color: #d6ece4;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        .desc-preview-content i {
            color: #ffb347;
            margin-right: 4px;
        }

        /* 联系方式区域 */
        .contact-block {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0f221d;
            border-radius: 48px;
            padding: 8px 18px;
            margin: 12px 0 8px;
            width: fit-content;
        }

        .contact-icon {
            background: #ffb34720;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffb347;
        }

        .contact-detail {
            font-weight: 600;
            font-size: 0.9rem;
            font-family: monospace;
            letter-spacing: 0.5px;
        }

        .date-meta {
            font-size: 0.65rem;
            color: #8aa9a3;
            margin: 8px 0 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 操作按钮 */
        .action-buttons {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }

        .action-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            flex: 1;
        }

        .btn-accept { background: #2a9d8f; color: white; }
        .btn-accept:hover { background: #248277; transform: translateY(-2px); }
        .btn-reject { background: #e76f51; color: white; }
        .btn-reject:hover { background: #d45f3f; transform: translateY(-2px); }
        .btn-complete { background: #6c9ebf; color: white; }
        .btn-complete:hover { background: #5a8aa8; transform: translateY(-2px); }
        .disabled-action {
            opacity: 0.6;
            font-size: 0.75rem;
            padding: 8px 12px;
            background: #2c423b;
            border-radius: 30px;
            text-align: center;
            color: #b6cfc8;
        }

        /* 拒绝原因小提示 */
        .reject-note {
            margin-top: 10px;
            background: rgba(231,111,81,0.18);
            border-radius: 18px;
            padding: 8px 12px;
            font-size: 0.7rem;
            color: #ffb99a;
        }

        /* 大弹窗模态框 - 高度调整为屏幕的90%左右 */
        .detail-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(16px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .detail-modal.active {
            display: flex;
        }

        .detail-modal-content {
            background: linear-gradient(145deg, #1f3a30, #162a22);
            max-width: 700px;
            width: 90%;
            max-height: 90vh;
            height: auto;
            border-radius: 48px;
            border: 1px solid #ffb347;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.6);
            animation: modalZoom 0.25s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @keyframes modalZoom {
            from { opacity: 0; transform: scale(0.95) translateY(10px);}
            to { opacity: 1; transform: scale(1) translateY(0);}
        }

        .modal-header {
            padding: 1.5rem 1.8rem 0.8rem 1.8rem;
            border-bottom: 1px solid rgba(255,180,71,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .modal-header h2 {
            font-size: 1.5rem;
            color: #ffdfb3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .modal-close {
            background: none;
            border: none;
            color: #ffb347;
            font-size: 1.6rem;
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-body {
            padding: 1.5rem 1.8rem;
            overflow-y: auto;
            flex: 1;
            scrollbar-width: thin;
        }

        .modal-body::-webkit-scrollbar {
            width: 5px;
        }
        .modal-body::-webkit-scrollbar-track {
            background: #253b33;
            border-radius: 10px;
        }
        .modal-body::-webkit-scrollbar-thumb {
            background: #ffb347;
            border-radius: 10px;
        }

        .detail-field {
            margin-bottom: 1.5rem;
        }

        .detail-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #ffb347;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .detail-text {
            font-size: 1rem;
            line-height: 1.6;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 16px;
            border-radius: 20px;
            white-space: pre-wrap;
            word-break: break-word;
            color: #eef4f7;
        }

        .detail-budget {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffcd7e;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f5c49;
            padding: 12px 26px;
            border-radius: 60px;
            color: #fff5e6;
            font-weight: 500;
            border-left: 6px solid #ffd966;
            z-index: 2100;
            animation: fadeInOut 2.5s ease;
            pointer-events: none;
            backdrop-filter: blur(8px);
            font-size: 0.9rem;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(20px);}
            15% { opacity: 1; transform: translateX(-50%) translateY(0);}
            85% { opacity: 1; transform: translateX(-50%) translateY(0);}
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px);}
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3.5rem;
            background: rgba(26, 44, 38, 0.5);
            border-radius: 48px;
        }

        .empty-state i { font-size: 3rem; opacity: 0.6; margin-bottom: 1rem; color: #ffb347; }

        /* 响应式：小屏幕下卡片调整，但状态按钮依然在一行（通过clamp自动缩小） */
        @media (max-width: 860px) {
            body { padding: 1rem; }
            .orders-grid { grid-template-columns: 1fr; gap: 1.2rem; }
            .budget-highlight { flex-direction: column; align-items: flex-start; gap: 6px; }
            .stats-inline { gap: 0.8rem; }
            .stat-pill { padding: 0.25rem 1rem; font-size: 0.75rem; }
            .detail-modal-content { max-height: 92vh; width: 95%; }
            .modal-header { padding: 1.2rem 1.2rem 0.5rem; }
            .modal-body { padding: 1.2rem; }
        }

        /* 极小屏幕下进一步缩小按钮内边距 */
        @media (max-width: 550px) {
            .filter-btn { padding: 6px clamp(8px, 2vw, 16px); font-size: 0.65rem; }
            .filter-bar { gap: clamp(3px, 0.8vw, 8px); padding: 6px clamp(4px, 1vw, 12px); }
        }

        /* 拒绝模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 1500;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }
        .reject-modal-content {
            background: linear-gradient(145deg, #1f3e32, #162b22);
            border-radius: 40px;
            padding: 2rem;
            width: 90%;
            max-width: 450px;
            border: 1px solid #ffb347;
        }
        .reject-modal-content textarea {
            width: 100%;
            padding: 12px;
            background: #2a453a;
            border: 1px solid #5f8b78;
            border-radius: 20px;
            color: white;
            resize: vertical;
            min-height: 100px;
        }
        .modal-buttons { display: flex; gap: 12px; margin-top: 1.5rem; }
        .modal-buttons button { flex: 1; padding: 10px; border-radius: 40px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
<div class="container">
    <!-- 头部区域：标题剧中 + 统计行内胶囊 -->
    <div class="hero-section">
        <div class="brand">
            <h1>委托工坊 · 专业中枢</h1>
        </div>
        <div class="stats-inline" id="statsInline">
            <div class="stat-pill"><strong id="totalCount">0</strong> 全部委托</div>
            <div class="stat-pill"><strong id="pendingCount">0</strong> 待处理</div>
            <div class="stat-pill"><strong id="acceptedCount">0</strong> 制作中</div>
        </div>
    </div>

    <!-- 状态按钮：强制一行 + 随屏幕缩放自动缩小，无横向滚动条 -->
    <div class="filter-wrapper">
        <div class="filter-bar">
            <button class="filter-btn active" data-status="all">📋 全部委托</button>
            <button class="filter-btn" data-status="pending">⏳ 待处理</button>
            <button class="filter-btn" data-status="accepted">⚙️ 制作中</button>
            <button class="filter-btn" data-status="completed">✅ 已完成</button>
            <button class="filter-btn" data-status="rejected">❌ 已拒绝</button>
        </div>
    </div>

    <div id="ordersGrid" class="orders-grid">
        <div class="empty-state"><i class="fas fa-spinner fa-pulse"></i> 加载委托数据...</div>
    </div>
</div>

<!-- 需求详情大弹窗 - 高度已调至屏幕90%左右 -->
<div id="detailModal" class="detail-modal">
    <div class="detail-modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-file-alt"></i> 委托需求详览</h2>
            <button class="modal-close" id="closeDetailModalBtn">&times;</button>
        </div>
        <div class="modal-body" id="detailModalBody"></div>
    </div>
</div>

<!-- 拒绝原因模态框 -->
<div id="rejectModal" class="modal">
    <div class="reject-modal-content">
        <h3 style="color:#ffd966; margin-bottom:12px;"><i class="fas fa-ban"></i> 婉拒委托</h3>
        <textarea id="rejectReason" placeholder="告知创作者具体原因，以便改进（例如：需求描述不够详细、预算偏低等）"></textarea>
        <div class="modal-buttons">
            <button id="confirmRejectBtn" style="background:#e76f51; color:white;">确认拒绝</button>
            <button id="cancelRejectBtn" style="background:#3b5c68; color:white;">取消</button>
        </div>
    </div>
</div>

<script>
    const API_BASE = '/api/custom';
    let currentFilter = 'all';
    let allOrders = [];
    let currentRejectOrderId = null;

    function showMessage(msg, isError = false) {
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = msg;
        toast.style.backgroundColor = isError ? '#aa4c36' : '#1e6f58';
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2600);
    }

    function formatDate(dateStr) {
        if (!dateStr) return '未知';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return '近期';
        return `${d.getFullYear()}-${(d.getMonth()+1).toString().padStart(2,'0')}-${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
    }

    function getStatusText(status) {
        const map = { pending: '待处理', accepted: '制作中', completed: '已完成', rejected: '已拒绝' };
        return map[status] || status;
    }
    function getStatusClass(status) { return `status-${status}`; }
    function escapeHtml(str) { if (!str) return ''; return str.replace(/[&<>]/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;' }[m])); }

    function updateStats() {
        document.getElementById('totalCount').textContent = allOrders.length;
        document.getElementById('pendingCount').textContent = allOrders.filter(o => o.status === 'pending').length;
        document.getElementById('acceptedCount').textContent = allOrders.filter(o => o.status === 'accepted').length;
    }

    function openDetailModal(order) {
        const modalBody = document.getElementById('detailModalBody');
        const contactIcon = order.contactType === 'qq' ? 'fa-qq' : 'fa-weixin';
        const contactName = order.contactType === 'qq' ? 'QQ' : '微信';
        modalBody.innerHTML = `
            <div class="detail-field">
                <div class="detail-label"><i class="fas fa-tag"></i> 委托标题</div>
                <div class="detail-text" style="font-weight:600;">${escapeHtml(order.title)}</div>
            </div>
            <div class="detail-field">
                <div class="detail-label"><i class="fas fa-coins"></i> 预算金额 · 高亮</div>
                <div class="detail-text detail-budget">¥ ${Number(order.budget).toFixed(2)}</div>
            </div>
            <div class="detail-field">
                <div class="detail-label"><i class="fas fa-align-left"></i> 完整需求描述</div>
                <div class="detail-text" style="white-space: pre-wrap; line-height:1.6;">${escapeHtml(order.description).replace(/\n/g, '<br>') || '暂无详细描述'}</div>
            </div>
            <div class="detail-field">
                <div class="detail-label"><i class="fas fa-address-card"></i> 联系方式</div>
                <div class="detail-text"><i class="fab ${contactIcon}"></i> ${contactName}: ${escapeHtml(order.contact)}</div>
            </div>
            <div class="detail-field">
                <div class="detail-label"><i class="far fa-calendar-alt"></i> 创建时间</div>
                <div class="detail-text">${formatDate(order.createdAt)}</div>
            </div>
            ${order.status === 'rejected' && order.rejectedReason ? `
            <div class="detail-field">
                <div class="detail-label"><i class="fas fa-info-circle"></i> 婉拒原因</div>
                <div class="detail-text" style="background:#2e3b2f; color:#ffc7a5;">${escapeHtml(order.rejectedReason).replace(/\n/g, '<br>')}</div>
            </div>` : ''}
        `;
        document.getElementById('detailModal').classList.add('active');
    }

    function renderOrders() {
        const gridContainer = document.getElementById('ordersGrid');
        let filtered = allOrders;
        if (currentFilter !== 'all') filtered = allOrders.filter(order => order.status === currentFilter);
        
        if (!filtered.length) {
            gridContainer.innerHTML = `<div class="empty-state"><i class="fas fa-inbox"></i><p>暂无委托单，静候佳音</p></div>`;
            updateStats();
            return;
        }

        gridContainer.innerHTML = filtered.map(order => {
            const contactIcon = order.contactType === 'qq' ? 'fa-qq' : 'fa-weixin';
            const contactLabel = order.contactType === 'qq' ? 'QQ' : '微信';
            let actionHtml = '';
            if (order.status === 'pending') {
                actionHtml = `<div class="action-buttons">
                    <button class="action-btn btn-accept" data-id="${order._id}" data-action="accept"><i class="fas fa-check-circle"></i> 接收委托</button>
                    <button class="action-btn btn-reject" data-id="${order._id}" data-action="reject"><i class="fas fa-times-circle"></i> 婉拒</button>
                </div>`;
            } else if (order.status === 'accepted') {
                actionHtml = `<div class="action-buttons"><button class="action-btn btn-complete" data-id="${order._id}" data-action="complete"><i class="fas fa-flag-checkered"></i> 标记完成</button></div>`;
            } else if (order.status === 'completed') {
                actionHtml = `<div class="disabled-action"><i class="fas fa-check-double"></i> 已完成 · 交付结束</div>`;
            } else {
                actionHtml = `<div class="disabled-action"><i class="fas fa-ban"></i> 已婉拒 · 不可操作</div>`;
            }

            let rejectNote = '';
            if (order.status === 'rejected' && order.rejectedReason) {
                rejectNote = `<div class="reject-note"><i class="fas fa-comment-dots"></i> 婉拒原因：${escapeHtml(order.rejectedReason).substring(0, 80)}${order.rejectedReason.length > 80 ? '…' : ''}</div>`;
            }

            return `
                <div class="order-card" data-order-id="${order._id}">
                    <div class="card-header">
                        <span class="status-badge ${getStatusClass(order.status)}">${getStatusText(order.status)}</span>
                        <div class="order-title">${escapeHtml(order.title)}</div>
                    </div>
                    
                    <div class="budget-highlight">
                        <span class="budget-label"><i class="fas fa-tag"></i> 委托预算</span>
                        <div class="budget-amount">¥ ${Number(order.budget).toFixed(2)} <small>RMB</small></div>
                    </div>
                    
                    <div class="desc-preview" data-order='${JSON.stringify(order)}' style="cursor:pointer;">
                        <div class="desc-preview-header">
                            <span><i class="fas fa-align-left"></i> 需求描述 · 点击展开完整内容</span>
                            <i class="fas fa-expand-alt"></i>
                        </div>
                        <div class="desc-preview-content">
                            <i class="fas fa-quote-left"></i> ${escapeHtml(order.description).substring(0, 120)}${order.description?.length > 120 ? '……' : ''}
                        </div>
                    </div>
                    
                    <div class="contact-block">
                        <div class="contact-icon"><i class="fab ${contactIcon}"></i></div>
                        <div class="contact-detail">${contactLabel}: ${escapeHtml(order.contact)}</div>
                    </div>
                    
                    <div class="date-meta"><i class="far fa-clock"></i> 委托时间：${formatDate(order.createdAt)}</div>
                    ${rejectNote}
                    <div>${actionHtml}</div>
                </div>
            `;
        }).join('');

        document.querySelectorAll('.desc-preview').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                const orderData = el.getAttribute('data-order');
                if (orderData) {
                    try {
                        const orderObj = JSON.parse(orderData);
                        openDetailModal(orderObj);
                    } catch(e) { console.warn(e); }
                }
            });
        });

        document.querySelectorAll('.action-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                const orderId = btn.dataset.id;
                const action = btn.dataset.action;
                if (action === 'accept') await acceptOrder(orderId);
                else if (action === 'reject') {
                    currentRejectOrderId = orderId;
                    document.getElementById('rejectModal').classList.add('active');
                } else if (action === 'complete') await completeOrder(orderId);
            });
        });
        updateStats();
    }

    async function acceptOrder(orderId) {
        try {
            const res = await fetch(`${API_BASE}/accept`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId }) });
            const result = await res.json();
            if (result.success) { showMessage('✅ 已接收委托，状态更新为「制作中」'); await fetchOrders(); } 
            else showMessage(result.msg || '操作失败', true);
        } catch(err) { showMessage('网络错误', true); }
    }
    async function rejectOrder(orderId, reason) {
        try {
            const res = await fetch(`${API_BASE}/reject`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId, reason }) });
            const result = await res.json();
            if (result.success) { showMessage('委托已婉拒'); await fetchOrders(); } 
            else showMessage(result.msg || '失败', true);
        } catch(err) { showMessage('网络错误', true); }
    }
    async function completeOrder(orderId) {
        try {
            const res = await fetch(`${API_BASE}/complete`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ orderId }) });
            const result = await res.json();
            if (result.success) { showMessage('🎉 委托完成！匠心交付'); await fetchOrders(); } 
            else showMessage(result.msg || '操作失败', true);
        } catch(err) { showMessage('网络错误', true); }
    }
    async function fetchOrders() {
        try {
            const res = await fetch(`${API_BASE}/admin`);
            const result = await res.json();
            if (result.success && Array.isArray(result.data)) { allOrders = result.data; renderOrders(); } 
            else document.getElementById('ordersGrid').innerHTML = '<div class="empty-state">加载失败，请刷新</div>';
        } catch(err) { document.getElementById('ordersGrid').innerHTML = '<div class="empty-state">网络错误，请重试</div>'; }
    }

    function bindFilters() {
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.status;
                renderOrders();
            });
        });
    }
    function bindModals() {
        const detailModal = document.getElementById('detailModal');
        const closeDetail = document.getElementById('closeDetailModalBtn');
        closeDetail.onclick = () => detailModal.classList.remove('active');
        detailModal.onclick = (e) => { if(e.target === detailModal) detailModal.classList.remove('active'); };
        
        const rejectModal = document.getElementById('rejectModal');
        const confirmReject = document.getElementById('confirmRejectBtn');
        const cancelReject = document.getElementById('cancelRejectBtn');
        const reasonInput = document.getElementById('rejectReason');
        confirmReject.onclick = async () => {
            const reason = reasonInput.value.trim();
            if(!reason) { showMessage('请填写拒绝原因', true); return; }
            rejectModal.classList.remove('active');
            await rejectOrder(currentRejectOrderId, reason);
            reasonInput.value = '';
            currentRejectOrderId = null;
        };
        cancelReject.onclick = () => { rejectModal.classList.remove('active'); reasonInput.value = ''; currentRejectOrderId = null; };
        rejectModal.onclick = (e) => { if(e.target === rejectModal) rejectModal.classList.remove('active'); };
    }

    async function init() {
        bindFilters();
        bindModals();
        await fetchOrders();
        setInterval(fetchOrders, 30000);
    }
    init();
</script>
</body>
</html>
