<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 武韵|指令</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #1a1a2e url('/scb/wallpaper_legends_Modular_A/wallpaper_minecraft_Modular_A_1080x1920.webp') center/cover fixed;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif; color: #eee; padding: 1rem;
    }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: rgba(0,0,0,0.55); z-index: 0;
    }
    .auth-card {
      position: relative; z-index: 1; width: 100%; max-width: 420px;
      background: rgba(30,40,35,0.9); backdrop-filter: blur(12px);
      border: 2px solid rgba(124,181,24,0.4); border-radius: 24px;
      padding: 2rem; box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    h1 { text-align: center; color: #7cb518; margin-bottom: 0.5rem; font-size: 1.6rem; }
    .subtitle { text-align: center; color: #aaa; font-size: 0.85rem; margin-bottom: 1.5rem; }
    .tabs { display: flex; gap: 0; margin-bottom: 1.5rem; border-radius: 12px; overflow: hidden; }
    .tab {
      flex: 1; padding: 10px; border: none; background: rgba(0,0,0,0.3);
      color: #aaa; cursor: pointer; font-size: 0.95rem;
    }
    .tab.active { background: #7cb518; color: #fff; font-weight: 600; }
    .form-group { margin-bottom: 1rem; }
    label { display: block; margin-bottom: 6px; color: #ccc; font-size: 0.85rem; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.35);
      color: #fff; font-size: 1rem;
    }
    input:focus { outline: none; border-color: #7cb518; }
    .submit-btn {
      width: 100%; padding: 14px; margin-top: 0.5rem;
      background: linear-gradient(95deg, #7cb518, #5a9e0e);
      border: none; border-radius: 14px; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
    }
    .submit-btn:hover { filter: brightness(1.1); }
    .msg { margin-top: 1rem; padding: 10px; border-radius: 10px; font-size: 0.9rem; display: none; }
    .msg.error { display: block; background: rgba(220,50,50,0.2); color: #ff8888; }
    .msg.success { display: block; background: rgba(50,180,50,0.2); color: #88ff88; }
    .back-link { display: block; text-align: center; margin-top: 1.2rem; color: #aaa; text-decoration: none; font-size: 0.85rem; }
    .back-link:hover { color: #7cb518; }
    #registerFields { display: none; }
  </style>
</head>
<body>
  <div class="auth-card">
    <h1><i class="fas fa-cube"></i> 武韵|指令</h1>
    <p class="subtitle">登录后可赚积分兑换作品、管理订单与委托</p>

    <div class="tabs">
      <button class="tab active" data-mode="login">登录</button>
      <button class="tab" data-mode="register">注册</button>
    </div>

    <form id="authForm">
      <div id="registerFields">
        <div class="form-group">
          <label>昵称（可选）</label>
          <input type="text" id="nickname" placeholder="显示名称" maxlength="30">
        </div>
      </div>
      <div class="form-group">
        <label>用户名</label>
        <input type="text" id="username" required placeholder="3-20 字符" autocomplete="username">
      </div>
      <div class="form-group">
        <label>密码</label>
        <input type="password" id="password" required placeholder="至少 6 位" autocomplete="current-password">
      </div>
      <button type="submit" class="submit-btn" id="submitBtn">登录</button>
    </form>

    <div class="msg" id="msgBox"></div>
    <a href="/" class="back-link"><i class="fas fa-arrow-left"></i> 返回首页</a>
  </div>

  <script src="/js/auth.js"></script>
  <script>
    let mode = "login"
    const params = new URLSearchParams(location.search)
    const redirect = params.get("redirect") || "/user-center.html"

    document.querySelectorAll(".tab").forEach(tab => {
      tab.addEventListener("click", () => {
        mode = tab.dataset.mode
        document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === tab))
        document.getElementById("registerFields").style.display = mode === "register" ? "block" : "none"
        document.getElementById("submitBtn").textContent = mode === "login" ? "登录" : "注册"
      })
    })

    document.getElementById("authForm").addEventListener("submit", async (e) => {
      e.preventDefault()
      const msgBox = document.getElementById("msgBox")
      msgBox.className = "msg"
      msgBox.textContent = ""

      const username = document.getElementById("username").value.trim()
      const password = document.getElementById("password").value
      const nickname = document.getElementById("nickname").value.trim()

      const btn = document.getElementById("submitBtn")
      btn.disabled = true
      btn.textContent = "处理中..."

      try {
        const data = mode === "login"
          ? await Auth.login(username, password)
          : await Auth.register(username, password, nickname)

        if (data.success) {
          msgBox.className = "msg success"
          msgBox.textContent = mode === "login" ? "登录成功，正在跳转..." : "注册成功，正在跳转..."
          setTimeout(() => { location.href = redirect }, 600)
        } else {
          msgBox.className = "msg error"
          msgBox.textContent = data.msg || "操作失败"
        }
      } catch (err) {
        msgBox.className = "msg error"
        msgBox.textContent = "网络错误"
      } finally {
        btn.disabled = false
        btn.textContent = mode === "login" ? "登录" : "注册"
      }
    })

    if (Auth.isLoggedIn()) location.href = redirect
  </script>
</body>
</html>
